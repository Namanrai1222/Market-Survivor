name: CI/CD

# Every push and PR: typecheck, lint, tests, production build (CI).
# Then build the Docker image and smoke-test the running container.
# On main only: publish the image to GitHub Container Registry (CD) as :latest and :sha-<commit>.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/namanrai1222/market-survivor

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  docker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name ms -p 3000:3000 -e MS_SEED_KEY="$(openssl rand -hex 32)" "$IMAGE:test"
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ms)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' ms | grep -qx healthy
          curl -fsS -o /dev/null http://localhost:3000/games/market-survivor
          curl -fsS -o /dev/null http://localhost:3000/api/ms/me
          echo "Container is healthy and serving."

      - name: Container logs
        if: always()
        run: docker logs ms || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
