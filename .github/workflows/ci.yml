name: CI/CD

# Every push and PR: typecheck, lint, tests, production build (CI).
# Then build the Docker image, smoke-test the running container, and deploy it to a throwaway
# Kubernetes cluster (kind) with the manifests in k8s/ to prove the rollout works.
# On main only: publish the image to GitHub Container Registry (CD) as :latest and :sha-<commit>.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/namanrai1222/market-survivor

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set +e
          pnpm build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # Logs need a GitHub login; annotations don't. Surface the failure where anyone can read it.
          if [ "$status" -ne 0 ]; then
            echo "::error title=pnpm build failed::$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit "$status"

  docker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name ms -p 3000:3000 -e MS_SEED_KEY="$(openssl rand -hex 32)" "$IMAGE:test"
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ms)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' ms | grep -qx healthy
          curl -fsS -o /dev/null http://localhost:3000/games/market-survivor
          curl -fsS -o /dev/null http://localhost:3000/api/ms/me
          echo "Container is healthy and serving."

      - name: Container logs
        if: always()
        run: docker logs ms || true

      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: ms

      - name: Deploy to Kubernetes and test
        run: |
          docker tag "$IMAGE:test" "$IMAGE:latest"
          kind load docker-image "$IMAGE:latest" --name ms
          kubectl apply -f k8s/namespace.yaml
          kubectl -n market-survivor create secret generic market-survivor --from-literal=MS_SEED_KEY="$(openssl rand -hex 32)"
          kubectl apply -k k8s/
          kubectl -n market-survivor rollout status deployment/market-survivor --timeout=180s
          kubectl -n market-survivor port-forward service/market-survivor 8080:8080 >/dev/null 2>&1 &
          sleep 3
          curl -fsS -o /dev/null http://localhost:8080/games/market-survivor
          curl -fsS -o /dev/null http://localhost:8080/api/ms/me
          kubectl -n market-survivor get deployment,pods,service,pvc
          echo "Deployed to Kubernetes and serving."

      - name: Kubernetes diagnostics
        if: failure()
        run: |
          kubectl -n market-survivor describe pods || true
          kubectl -n market-survivor logs deployment/market-survivor --tail=50 || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
