# kubectl apply -k k8s/
# The MS_SEED_KEY secret is never committed; create it once per cluster:
#   kubectl -n market-survivor create secret generic market-survivor --from-literal=MS_SEED_KEY=$(openssl rand -hex 32)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: market-survivor
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
