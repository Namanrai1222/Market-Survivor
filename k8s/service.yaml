# LoadBalancer: on Docker Desktop's Kubernetes this is served at http://localhost:8080
# (8080 so it doesn't clash with docker compose on 3000).
apiVersion: v1
kind: Service
metadata:
  name: market-survivor
spec:
  type: LoadBalancer
  selector:
    app: market-survivor
  ports:
    - name: http
      port: 8080
      targetPort: http
